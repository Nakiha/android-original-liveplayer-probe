plugins { id 'com.android.application' }

android {
    namespace 'local.originalplayer.probe'
    compileSdk 35
    defaultConfig {
        applicationId 'local.originalplayer.probe'
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName '0.1-research'
    }
    buildTypes { debug { minifyEnabled false } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
