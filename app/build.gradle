plugins { id 'com.android.application' }

android {
    namespace 'local.originalplayer.probe'
    compileSdk 35
    defaultConfig {
        applicationId 'local.originalplayer.probe'
        minSdk 23
        targetSdk 34
        versionCode 3
        versionName '0.3-research'
    }
    buildTypes { debug { minifyEnabled false } }
    sourceSets {
        main.assets.srcDir layout.buildDirectory.dir('generated/observer-assets')
        debug.assets {
            srcDir '../samples/generated'
            include 'h264.flv', 'h265.flv', 'h266-enhanced.flv'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

def observerAssets = layout.buildDirectory.dir('generated/observer-assets')
tasks.register('buildObserverDex') {
    dependsOn ':observer-bridge:jar', ':observer-api:jar'
    inputs.file(project(':observer-bridge').tasks.named('jar').flatMap { it.archiveFile })
    inputs.file(project(':observer-api').tasks.named('jar').flatMap { it.archiveFile })
    outputs.dir(observerAssets)
    doLast {
        def output = observerAssets.get().asFile
        output.mkdirs()
        def sdk = android.sdkDirectory
        exec {
            commandLine new File(System.getProperty('java.home'), 'bin/java').absolutePath,
                '-cp', new File(sdk, 'build-tools/35.0.0/lib/d8.jar').absolutePath,
                'com.android.tools.r8.D8', '--min-api', '23', '--output', output.absolutePath,
                '--lib', new File(sdk, 'platforms/android-35/android.jar').absolutePath,
                '--classpath', project(':observer-api').tasks.named('jar').get().archiveFile.get().asFile.absolutePath,
                project(':observer-bridge').tasks.named('jar').get().archiveFile.get().asFile.absolutePath
        }
    }
}
tasks.named('preBuild').configure { dependsOn 'buildObserverDex' }

// Optional emulator variant: only owned code is bundled to select ARM64 process ABI.
if (providers.gradleProperty('probeArm64Host').orNull == 'true') {
    android.ndkVersion = '25.2.9519653'
    def markerRoot = layout.buildDirectory.dir('generated/arm64-host')
    android.sourceSets.debug.jniLibs.srcDir markerRoot
    tasks.register('buildArm64HostMarker') {
        inputs.file('src/main/c/arm64_host.c')
        outputs.file(markerRoot.map { it.file('arm64-v8a/libprobe_arm64_host.so') })
        doLast {
            def target = markerRoot.get().file('arm64-v8a/libprobe_arm64_host.so').asFile
            target.parentFile.mkdirs()
            def host = System.getProperty('os.name').toLowerCase().contains('windows') ? 'windows-x86_64' : 'linux-x86_64'
            def suffix = host.startsWith('windows') ? '.exe' : ''
            def clang = new File(android.sdkDirectory, "ndk/25.2.9519653/toolchains/llvm/prebuilt/$host/bin/clang$suffix")
            exec {
                commandLine clang.absolutePath, '--target=aarch64-linux-android23', '-fPIC', '-shared', '-nostdlib',
                    '-Wl,-soname,libprobe_arm64_host.so', '-Wl,-z,max-page-size=16384', '-Wl,--build-id=sha1',
                    file('src/main/c/arm64_host.c').absolutePath, '-o', target.absolutePath
            }
        }
    }
    tasks.named('preBuild').configure { dependsOn 'buildArm64HostMarker' }
}
